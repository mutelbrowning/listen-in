<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bird Dashboard</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #f6efe0; color: #2b2a24;
    font-family: "Iowan Old Style", "Palatino", Georgia, serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px;
  }
  h1 { margin: 0; font-size: 2rem; font-weight: 600; }
  p { margin: 0; font-size: 1.2rem; opacity: 0.7; font-style: italic; }
  button { font: inherit; font-size: 1.2rem; padding: 10px 26px; border-radius: 999px; border: 0; background: #2f4a3a; color: #fff; display: none; }
</style>
</head>
<body>
<h1>Bird Dashboard</h1>
<p id="msg">Connecting</p>
<button id="retry">Try again</button>
<script>
function go() {
  const msg = document.getElementById("msg");
  const btn = document.getElementById("retry");
  btn.style.display = "none";
  msg.textContent = "Connecting";
  fetch("dashboard.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(d => { if (d.url) { window.location.replace(d.url); } else { throw 0; } })
    .catch(() => { msg.textContent = "Dashboard is offline right now"; btn.style.display = "inline-block"; });
}
document.getElementById("retry").addEventListener("click", go);
go();
</script>
</body>
</html>
